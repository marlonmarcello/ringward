<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ringward</title>
  <link rel="icon" href="./assets/icon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body class="starting">
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg">
    <symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></symbol>
    <symbol id="box" viewBox="0 0 24 24"><path d="M3 8h18v13H3zM2 3h20v5H2zM9 12h6"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></symbol>
    <symbol id="save" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 4 8 8 9 4-1 8-4 8-9V6zM8 12l3 3 5-6"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
    <symbol id="grip" viewBox="0 0 24 24"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.2.9-4.5 4.4 1.1 6.1-5.5-2.9-5.5 2.9 1.1-6.1-4.5-4.4 6.2-.9z"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 13h6m-6 4h6"/></symbol>
    <symbol id="cross" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <aside class="rail" id="rail" aria-label="Main navigation"></aside>
  <main class="shell">
    <header class="topbar" id="topbar"></header>
    <div id="content" class="content" aria-live="polite">
      <h1>Open the Ringward desktop app</h1>
      <p class="intro">Open Ringward from the Start menu, or run <code>Ringward.exe</code> from the newest unpacked build in the project's <code>release</code> folder.</p>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="operation" class="operation" role="status" hidden><span class="spinner"></span><span id="operation-text"></span><progress max="1"></progress></div>
  <dialog id="dialog">
    <form id="dialog-form">
      <header><h2 id="dialog-title"></h2><button type="button" class="icon" data-action="close-dialog" aria-label="Close"><svg><use href="#cross"/></svg></button></header>
      <div id="dialog-content"></div>
      <footer><button type="button" data-action="close-dialog">Cancel</button><button id="dialog-submit" class="primary" type="submit">Save</button></footer>
    </form>
  </dialog>
</body>
</html>
