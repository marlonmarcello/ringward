name: Windows CI and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Plan release and extract notes
        id: release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $previous = git show "${env:PREVIOUS_SHA}:package.json" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the previous app version.' }
          if ($previous.version -eq $version) { return }
          if ([version]$previous.version -ge [version]$version) { throw 'The release version must increase.' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw 'Both npm version files must match.'
          }
          $escaped = [regex]::Escape($version)
          $pattern = '(?ms)^## (?:\[' + $escaped + '\]|' + $escaped + ')(?:[ \t][^\r\n]*)?\r?\n(.*?)(?=^## |^\[[^\]]+\]:|\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern).Groups[1].Value.Trim()
          if (!$section) { throw "Add a changelog entry for $version before releasing." }
          New-Item -ItemType Directory -Path artifacts | Out-Null
          $section | Set-Content artifacts/release-notes.md -Encoding utf8
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm test
      - name: Build Windows installer and unpacked app
        run: npm run build -- --x64 --publish never
      - name: Prepare Windows downloads and checksums
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = 'Ringward-{0}-win-x64.zip' -f $env:RELEASE_TAG
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer from electron-builder.' }
          $installer = $installers[0]
          Compress-Archive -LiteralPath release/win-unpacked -DestinationPath "artifacts/$zip"
          Copy-Item -LiteralPath $installer.FullName -Destination artifacts
          $checksums = foreach ($file in @($installer.Name, $zip)) {
            $hash = (Get-FileHash -LiteralPath "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          (($checksums -join "`n") + "`n") | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.tag != ''
        with:
          name: windows-release
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: changesets-main
      queue: max
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check whether this run is still on main
        id: main-tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping version PR update because main has advanced."
          fi
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.main-tip.outputs.current == 'true'
        with:
          version-script: npm run version:release
          pr-title: Version Ringward
          commit-message: Version Ringward
          create-github-releases: false
          push-git-tags: false

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release-tag != ''
    needs: build
    runs-on: ubuntu-latest
    concurrency: release-${{ needs.build.outputs.release-tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require protected main for release signing
        if: ${{ !github.ref_protected }}
        run: |
          echo "::error::Protect main before attesting or publishing a release."
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: artifacts
      - name: Attest Windows release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.release-tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release-sha }}
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == "false" ]]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          shopt -s nullglob
          installers=(artifacts/*.exe)
          archives=(artifacts/*.zip)
          if (( ${#installers[@]} != 1 || ${#archives[@]} != 1 )); then
            echo "Expected one staged installer and one portable ZIP."
            exit 1
          fi
          cp -- "$ATTESTATION" artifacts/windows-update.sigstore.json
          assets=("${installers[@]}" "${archives[@]}" artifacts/SHA256SUMS.txt artifacts/windows-update.sigstore.json)
          # A tag pushed with GITHUB_TOKEN does not trigger a second workflow run.
          if ! tagged_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA" > /dev/null
            tagged_commit="$RELEASE_SHA"
          fi
          [[ "$tagged_commit" == "$RELEASE_SHA" ]] || { echo "Tag $TAG points to a different commit."; exit 1; }
          if [[ "$draft" == "true" ]]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$TAG" == v0.* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft "${flags[@]}" \
              --title "Ringward $TAG" --notes-file artifacts/release-notes.md
          fi
          gh release edit "$TAG" --draft=false
