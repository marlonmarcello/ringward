name: Windows CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Validate release version and extract notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version" -or
              $lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw 'The release tag and both npm version files must match.'
          }
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |^\[[^\]]+\]:|\z)'
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern).Groups[1].Value.Trim()
          if (!$section) { throw "Add a changelog entry for $version before releasing." }
          New-Item -ItemType Directory -Path artifacts | Out-Null
          $section | Set-Content artifacts/release-notes.md -Encoding utf8
      - run: npm ci
      - run: npm test
      - name: Build Windows app
        run: npm run build:unpacked
      - name: Create Windows ZIP and checksum
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $file = 'Ringward-{0}-win-x64.zip' -f $env:GITHUB_REF_NAME
          Compress-Archive -LiteralPath release/win-unpacked -DestinationPath "artifacts/$file"
          $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: windows-release
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: artifacts
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=("artifacts/Ringward-${TAG}-win-x64.zip" artifacts/SHA256SUMS.txt)
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == "false" ]]; then
              echo "Release $TAG is already published."
              exit 0
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$TAG" == v0.* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft "${flags[@]}" \
              --title "Ringward $TAG" --notes-file artifacts/release-notes.md
          fi
          gh release edit "$TAG" --draft=false
